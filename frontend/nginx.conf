server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;   # uploads; the backend enforces MAX_UPLOAD_MB (20 MB by default)

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;  # LLM connection tests and generation can be slow
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;   # client-side routes
    }
}
