# NVIDIA GPU override for the embedding models (needs the NVIDIA Container Toolkit;
# Docker Desktop on Windows provides it through WSL2)
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build

services:
  backend:
    build:
      args:
        TORCH_VARIANT: cu128   # CUDA 12.8 build, supports RTX 50-series
    image: rag-eval-backend:cu128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
