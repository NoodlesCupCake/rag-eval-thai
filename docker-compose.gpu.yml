# NVIDIA GPU override (needs the NVIDIA Container Toolkit; Docker Desktop on Windows has it with WSL2)
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# add --profile ollama to run Ollama on the GPU too

services:
  app:
    build:
      args:
        TORCH_VARIANT: cu128   # CUDA 12.8 build, supports RTX 50-series
    image: bantat:cu128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
