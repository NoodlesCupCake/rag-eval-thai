# docker compose up --build                       app on http://localhost:8000 (CPU)
# docker compose --profile ollama up --build      also start Ollama in a container
# GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build

services:
  app:
    build:
      context: .
      args:
        TORCH_VARIANT: cpu
    image: bantat:cpu
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # documents, QA set, runs, LLM settings
      - hf-models:/models         # downloaded embedding models survive rebuilds
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # lets the app reach Ollama / LM Studio running on the host machine:
      # base URL http://host.docker.internal:11434/v1
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # inside compose, set the app's base URL to http://ollama:11434/v1
    # pull a model: docker compose exec ollama ollama pull qwen2.5:7b

volumes:
  hf-models:
  ollama:
