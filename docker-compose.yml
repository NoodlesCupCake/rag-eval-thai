# docker compose up --build        http://localhost:8000 (embeddings on CPU)
# GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# The LLM (Claude, or an OpenAI-compatible server such as Ollama or LM Studio) is set on
# the app's ตั้งค่า LLM page. Servers on this machine are reachable from the backend
# container at http://host.docker.internal:<port>/v1

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_VARIANT: cpu
    image: rag-eval-backend:cpu
    volumes:
      - ./data:/app/data          # documents, QA set, runs, LLM settings
      - hf-models:/models         # downloaded embedding models survive rebuilds
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: rag-eval-frontend
    ports:
      - "8000:80"                 # nginx serves the React app and proxies /api to backend
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf-models:
